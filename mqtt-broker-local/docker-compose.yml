services:
  mosquitto:
    image: eclipse-mosquitto:2.0.18
    container_name: mqtt-broker-local
    restart: unless-stopped
    ports:
      - "1883:1883"
      - "8883:8883"
      - "9001:9001"
    volumes:
      - ./config:/mosquitto/config
      - ./data:/mosquitto/data
      - ./log:/mosquitto/log