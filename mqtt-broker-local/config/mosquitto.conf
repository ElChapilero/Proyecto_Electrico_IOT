# --- Listener principal MQTT (sin cifrar) ---
# Se mantiene activo durante la migracion a TLS. Una vez que
# confirmes que el ESP32 y el backend conectan bien por 8883,
# podes comentar este bloque entero para forzar solo TLS.
listener 1883
protocol mqtt

# --- Listener MQTT sobre TLS (nuevo) ---
listener 8883
protocol mqtt
certfile /mosquitto/config/certs/server.crt
keyfile /mosquitto/config/certs/server.key
tls_version tlsv1.2

# --- Listener WebSockets (útil para probar desde el navegador o apps web) ---
listener 9001
protocol websockets

# --- Persistencia de mensajes y sesiones ---
persistence true
persistence_location /mosquitto/data/

# --- Logs ---
log_dest file /mosquitto/log/mosquitto.log
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information

# --- Autenticación ---
allow_anonymous false
password_file /mosquitto/config/passwd

acl_file /mosquitto/config/acl.conf
